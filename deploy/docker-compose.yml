# Single-node broker, with a self-hosted object store alongside it.
#
#   cp deploy/env.example deploy/.env      # then fill it in
#   docker compose -f deploy/docker-compose.yml up --build
#
# **`.env` has to sit next to this file.** Compose reads it from the compose
# file's own directory, not from wherever you happen to be standing, so a `.env`
# at the repository root is silently ignored and required variables turn up
# missing. If you keep one there anyway, name it explicitly:
#
#   docker compose --env-file .env -f deploy/docker-compose.yml up --build
#
# The broker refuses to start if it cannot reach its bucket or the Spyglass
# lab schema, so a container that comes up is one whose configuration works.
#
# ---------------------------------------------------------------------------
# THIS FILE SERVES PLAIN HTTP
#
# Fine where TLS is terminated in front of it — then set
# SPYGLASS_STORE_EDGE_TRUSTED_PROXY to that hop's address, or the rate limits
# lump every caller into one bucket. If nothing else terminates TLS, add the
# override, which publishes 80 and 443 instead of 8000:
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.tls.yml up
#
# Bearer tokens and presigned URLs both travel in the clear otherwise.
# ---------------------------------------------------------------------------
#
# ---------------------------------------------------------------------------
# ONE CONSTRAINT THAT IS EASY TO BREAK
#
# The broker and the object store must be reachable at DIFFERENT ORIGINS —
# different ports below, different HOSTNAMES behind a proxy. Same-origin breaks
# every read, with an error that names a checksum rather than the real cause.
# Set SPYGLASS_STORE_PUBLIC_BASE_URL and the broker warns at startup.
# deploy/README.md explains why.
# ---------------------------------------------------------------------------

name: spyglass-store

services:
  store:
    # Ceph RGW, the implementation this deployment targets. Pinned by digest:
    # `demo` carries no release tags, and a digest cannot be re-pointed under a
    # deployment that did not ask for it.
    #
    # This is a *development* store. A real deployment points
    # SPYGLASS_STORE_S3_ENDPOINT_URL at an existing cluster and does not run
    # this service at all — a single-node demo cluster is not somewhere to keep
    # research data.
    image: quay.io/ceph/demo@sha256:522483cf07cfce6386b8e18a3edfa88a1b32c688dee231d0a6962b1513557723
    restart: unless-stopped
    # MON_IP has to be the container's own address, which is not known until it
    # starts — so the wrapper asks from inside and hands over to the image's
    # real entrypoint. `NETWORK_AUTO_DETECT` is documented to do this and does
    # not work on this image.
    entrypoint:
      - /bin/bash
      - -c
      - >
        export MON_IP=$$(hostname -i | awk '{print $$1}');
        export CEPH_PUBLIC_NETWORK=$$(hostname -i
        | awk '{split($$1,a,"."); print a[1]"."a[2]".0.0/16"}');
        exec /opt/ceph-container/bin/demo
    environment:
      DEMO_DAEMONS: mon,osd,rgw
      OSD_TYPE: directory
      RGW_NAME: localhost
      RGW_FRONTEND_PORT: "8080"
      CEPH_DEMO_UID: broker
      # The bucket is created by the image, which is why there is no separate
      # job to make one. The broker still refuses to boot without it.
      CEPH_DEMO_BUCKET: ${SPYGLASS_STORE_S3_BUCKET:-spyglass-store}
      CEPH_DEMO_ACCESS_KEY: ${SPYGLASS_STORE_S3_ACCESS_KEY:?set in .env}
      CEPH_DEMO_SECRET_KEY: ${SPYGLASS_STORE_S3_SECRET_KEY:?set in .env}
    volumes:
      - objects:/var/lib/ceph
    ports:
      # A distinct origin from the broker. See the note above. Published,
      # because clients follow presigned URLs here — the broker redirects and
      # steps out of the data path, so a store only this host can reach means
      # every download fails at the redirect.
      - "9000:8080"
    healthcheck:
      # RGW has no liveness endpoint, so the S3 API itself is the probe — and
      # any HTTP answer means it is serving. Not `-f`: an anonymous GET of the
      # service root is commonly 403, which would leave the store unhealthy
      # forever and the broker never started.
      test: ["CMD", "curl", "-sS", "-o", "/dev/null", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 30
      # A single-node cluster takes a while to reach a serving state.
      start_period: 120s



  broker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      store:
        condition: service_healthy
    # Everything in `.env` reaches the broker, so every setting in
    # `settings.py` is reachable without being listed twice. The variables named
    # below are the ones this file needs for itself — a required check, a
    # default that points at the compose network — and `environment` wins over
    # `env_file`, so naming one here does not stop `.env` from setting it.
    #
    # Deliberately not done for the edge: it would hand the database password
    # and the object-store credentials to a container that needs neither.
    env_file:
      - path: .env
        required: false
    environment:
      # Database: DataJoint's own variables, not broker settings. The broker
      # deliberately does not re-declare these — an admin who can already
      # reach the instance needs no new configuration.
      DJ_HOST: ${DJ_HOST:?the ServerHost MySQL instance}
      DJ_USER: ${DJ_USER:?}
      DJ_PASS: ${DJ_PASS:?}

      # Identity. Register an app per deployment; see docs/src/github-app.md.
      SPYGLASS_STORE_GITHUB_CLIENT_ID: ${SPYGLASS_STORE_GITHUB_CLIENT_ID:?}

      # Object store.
      #
      # **This address is signed into every presigned URL**, so it has to be
      # one the *client* can reach, not only one the broker can. The default
      # below is the compose service name, which works for a client on this
      # network and for nothing else — a laptop following a redirect to
      # `http://store:8080` cannot resolve it.
      #
      # For anything beyond a single-host trial, set this to the address
      # clients use and make sure the broker can reach the same one.
      SPYGLASS_STORE_S3_ENDPOINT_URL: ${SPYGLASS_STORE_S3_ENDPOINT_URL:-http://store:8080}
      SPYGLASS_STORE_S3_BUCKET: ${SPYGLASS_STORE_S3_BUCKET:-spyglass-store}
      SPYGLASS_STORE_S3_ACCESS_KEY: ${SPYGLASS_STORE_S3_ACCESS_KEY:?}
      SPYGLASS_STORE_S3_SECRET_KEY: ${SPYGLASS_STORE_S3_SECRET_KEY:?}
      SPYGLASS_STORE_S3_REGION: ${SPYGLASS_STORE_S3_REGION:-default}

      # Used only for the same-origin warning described above.
      SPYGLASS_STORE_PUBLIC_BASE_URL: ${SPYGLASS_STORE_PUBLIC_BASE_URL:-}

      SPYGLASS_STORE_SCHEMA_PREFIX: ${SPYGLASS_STORE_SCHEMA_PREFIX:-store}
      SPYGLASS_STORE_PRESIGNED_TTL_SECONDS: ${SPYGLASS_STORE_PRESIGNED_TTL_SECONDS:-300}
    # Deliberately not published to the host. The edge below is the front door,
    # and it is where the unauthenticated login endpoints are rate limited — a
    # published broker port is a way around that limit. To reach the broker
    # directly while debugging, `docker compose exec` into the network rather
    # than opening a port here.
    expose:
      - "8000"
    restart: unless-stopped
    # The edge waits on this, so it has to mean something. Startup already
    # verifies the bucket and the lab schema; this only asks whether the process
    # is still serving. `python -c` rather than curl because the image carries
    # no HTTP client — see deploy/Dockerfile on why it carries as little as
    # possible.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request, sys
          sys.exit(0 if urllib.request.urlopen(
              "http://127.0.0.1:8000/healthz", timeout=3
          ).status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 6
      # Generous: the first request opens a MySQL connection and reflects the
      # Spyglass lab schema. A tighter window restarts a broker that was only
      # still starting.
      start_period: 60s
    # Unbounded container logs are a way to fill a disk without deploying
    # anything. Every refusal is in `AccessLog` regardless; this is stdout.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  # The rate limiter, and the only reason this deployment has a proxy at all.
  # `/auth/device` and `/auth/token` take no credential and spend the broker's
  # own GitHub client id, so they need a ceiling — and the hop that knows the
  # caller's address is the one that can enforce one. See nginx/.
  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      # Not just "started": nginx resolves its upstream when it loads its
      # configuration, so an edge that comes up first answers 502 until
      # something restarts it.
      broker:
        condition: service_healthy
    volumes:
      # Templates, not configs: the image renders anything under
      # /etc/nginx/templates through envsubst at startup, which is what makes
      # the limits settable from `.env`. Mounted file by file rather than as a
      # directory, so that `docker-compose.tls.yml` can add the TLS front door
      # without this file having to know about it.
      #
      # `proxy.inc` is the shared server body, and it renders to a name that
      # nginx's `conf.d/*.conf` glob does not match — it is included by a front
      # door, never loaded on its own.
      - ./nginx/limits.conf.template:/etc/nginx/templates/limits.conf.template:ro
      - ./nginx/proxy.inc.template:/etc/nginx/templates/proxy.inc.template:ro
      # Mounted as `default.conf.template` so the rendered output lands on the
      # image's own stock `default.conf` and replaces it. Left in place, that
      # file serves an nginx welcome page on port 80 — harmless here, where
      # nothing publishes 80, and not harmless once the TLS overlay does.
      - ./nginx/http.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      # Substitute only our own variables. Without this filter envsubst is
      # handed every name in the environment, and nginx's configuration is full
      # of `$variables` that must survive rendering untouched.
      NGINX_ENVSUBST_FILTER: "^SPYGLASS_STORE_EDGE_"

      # The rate limits, with the defaults the template documents. Edge
      # settings, not broker settings — the application never reads these.
      #
      # Starting a login is rare and human.
      SPYGLASS_STORE_EDGE_DEVICE_RATE: ${SPYGLASS_STORE_EDGE_DEVICE_RATE:-6r/m}
      SPYGLASS_STORE_EDGE_DEVICE_BURST: ${SPYGLASS_STORE_EDGE_DEVICE_BURST:-5}

      # Polling is neither. The device flow polls every `interval` seconds — 5
      # by default — until the user approves, so an honest login sustains 12r/m
      # for as long as they take. Tightening this breaks slow logins.
      SPYGLASS_STORE_EDGE_POLL_RATE: ${SPYGLASS_STORE_EDGE_POLL_RATE:-15r/m}
      SPYGLASS_STORE_EDGE_POLL_BURST: ${SPYGLASS_STORE_EDGE_POLL_BURST:-20}

      # The ceiling across all callers, because one GitHub client id is shared
      # by everyone and per-address limits do nothing against a spread-out
      # flood. Raising this raises how much of that budget one flood can spend.
      SPYGLASS_STORE_EDGE_TOTAL_RATE: ${SPYGLASS_STORE_EDGE_TOTAL_RATE:-240r/m}
      SPYGLASS_STORE_EDGE_TOTAL_BURST: ${SPYGLASS_STORE_EDGE_TOTAL_BURST:-40}

      # Seconds, sent as `Retry-After` on a throttled response.
      SPYGLASS_STORE_EDGE_RETRY_AFTER: ${SPYGLASS_STORE_EDGE_RETRY_AFTER:-60}

      # The address of the proxy in front of this one, if there is one, so the
      # limits key on the real caller rather than on that proxy. Name it
      # exactly; the default trusts nothing, and a wide range lets a caller
      # choose their own bucket by forging `X-Forwarded-For`.
      SPYGLASS_STORE_EDGE_TRUSTED_PROXY: ${SPYGLASS_STORE_EDGE_TRUSTED_PROXY:-127.0.0.1}
    healthcheck:
      # Against the plain listener, which exists in both the HTTP and the TLS
      # deployment — so this check does not change when TLS is added.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    ports:
      # The broker's public port, now served by the edge. A distinct origin
      # from the object store above; see the note at the top of this file.
      - "8000:8000"

volumes:
  objects:
