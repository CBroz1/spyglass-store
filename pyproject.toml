[build-system]
build-backend = "hatchling.build"

requires = [ "hatchling>=1.26.3,<2" ]

[project]
name = "spyglass-store"
description = "Permission and metering broker for shared NWB file storage."
readme = "docs/src/index.md"
license = "MIT"
authors = [ { name = "Chris Broz" } ]
requires-python = ">=3.10,<3.14"
classifiers = [
  "Natural Language :: English",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dynamic = [ "version" ]

dependencies = [
  "boto3>=1.34",
  "datajoint>=0.14.5,<2.0", # matches spyglass pin
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
]

optional-dependencies.serve = [ "uvicorn>=0.30" ]
urls.Homepage = "https://github.com/LorenFrankLab/spyglass-store"
urls.Repository = "https://github.com/LorenFrankLab/spyglass-store"

[tool.hatch.build.targets.sdist]
include = [ "src", "tests" ]

[tool.hatch.build.targets.wheel]
packages = [ "src/spyglass_store" ]

[tool.hatch.version]
path = "src/spyglass_store/__init__.py"

[tool.ruff]
line-length = 80
src = [ "src", "tests" ]

format.docstring-code-format = true
lint.extend-select = [ "I", "UP" ]
lint.isort.known-first-party = [ "src", "tests" ]

[tool.pytest.ini_options]
addopts = "-q"
minversion = "6.0"
testpaths = [ "tests" ]

[tool.coverage.report]
exclude_lines = [ "if TYPE_CHECKING:", "pragma: no cover" ]
fail_under = 70
show_missing = true

[tool.coverage.run]
command_line = "-m pytest"
source_pkgs = [ "spyglass_store", "tests" ]

[tool.coverage.paths]
spyglass_store = [ "src/spyglass_store" ]
tests = [ "tests" ]
