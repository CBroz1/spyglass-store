docs_dir: src
site_dir: site
edit_uri: ""
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.magiclink:
      user: LorenFrankLab
      repo: spyglass-store
      repo_url_shorthand: true
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tasklist:
      clickable_checkbox: false
      custom_checkbox: true
  - toc:
      permalink: true
      toc_depth: 3
nav:
  - "index.md"
  - "github-app.md"
repo_name: LorenFrankLab/spyglass-store
repo_url: https://github.com/LorenFrankLab/spyglass-store
site_name: spyglass-store docs
site_url: ""
theme:
  favicon: assets/images/favicon.png
  logo: assets/images/favicon.png
  features:
    - content.code.annotate
    - content.code.copy
    - header.autohide
    - navigation.instant
    - navigation.top
  font: false
  icon:
    repo: octicons/mark-github-16
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
use_directory_urls: false
