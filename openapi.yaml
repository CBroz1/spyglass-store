openapi: 3.1.0

info:
  title: spyglass-store broker
  version: 1.0.0
  description: |
    Permission and metering broker for shared NWB file storage.

    The broker never serves file bytes. It authenticates a GitHub identity,
    decides whether that identity may read a file, and issues a short-lived
    presigned URL to the object store. Once issued, the broker is out of the
    data path and cannot revoke or meter the transfer, which is why URL
    lifetimes are short and volume is charged at issue time.

    Volume limits are a guardrail against a runaway script or a careless bulk
    pull, not an accounting system. A legitimate user is not expected to
    approach them, and every imprecision in them errs toward letting a real
    user through.

    This document is the contract. The Spyglass client validates against it in
    CI, and this repository contract-tests against the released client. The
    path is versioned so a broker upgrade never breaks pinned clients, which
    matters more than usual because we do not control when users upgrade.
  license:
    name: MIT

servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: localhost:8000

security:
  - bearerAuth: []

paths:
  /info:
    get:
      summary: What this deployment expects of a client
      description: |
        Read once per session and cache it. One fact today: which digests to
        compute when registering a file.

        The broker signs whatever digests it is given, but only the operator
        knows whether the store behind the endpoint verifies the SHA-256
        checksum or ignores it. Ceph RGW ignores it — it signs the header and
        stores whatever arrives — so a client there must also send an MD5,
        while a client against MinIO or R2 need not. Hashing a multi-gigabyte
        NWB file for a digest nobody checks is worth avoiding.
      operationId: getServerInfo
      responses:
        "200":
          description: Deployment facts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/device:
    post:
      summary: Begin GitHub device flow
      description: |
        Returns a code the user types at GitHub. No callback server is needed,
        so this works over SSH and inside Docker.

        Unauthenticated, and therefore rate limited at the edge rather than
        metered per account. Starting a login is a human action; a client that
        automates it will meet a 429.
      security: []
      operationId: beginDeviceFlow
      responses:
        "200":
          description: Device and user codes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCode"
        "429":
          $ref: "#/components/responses/Throttled"

  /auth/token:
    post:
      summary: Exchange a device code for a broker token
      description: |
        Polled at the `interval` the device response gave, until the user
        approves. Unauthenticated, so it is rate limited at the edge with
        enough headroom for that polling — a client that honours `interval`
        and the `Retry-After` on a 428 will not meet a 429.
      security: []
      operationId: exchangeDeviceCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_code]
              properties:
                device_code:
                  type: string
      responses:
        "200":
          description: Broker token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
        "428":
          description: Authorization still pending; keep polling
        "403":
          description: Account rejected, for example below the minimum age
        "429":
          $ref: "#/components/responses/Throttled"

  /file/resolve:
    get:
      summary: Resolve a name or hash to a file id
      operationId: resolveFile
      parameters:
        - name: name
          in: query
          schema:
            type: string
          description: Spyglass file name. One of name or sha256 is required.
        - name: sha256
          in: query
          schema:
            $ref: "#/components/schemas/Sha256"
      responses:
        "200":
          description: Matching file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            No such file, or none this identity may read. See the note on the
            content endpoint for why those are one answer.
        "422":
          description: Neither name nor sha256 was given

  /file:
    post:
      summary: Register an upload
      description: |
        Records the file and returns a presigned URL to write the object,
        plus the headers that must accompany the write.

        Registering a hash that already exists deduplicates: the existing
        object is reused and no upload URL is returned.

        A **raw** name identifies one file: registering one that already exists
        against different content is refused with 409. Several accounts may
        register the same raw — that is deduplication — but not disagree about
        what it holds, because an analysis file inherits the visibility of the
        raw it derives from, and that relationship is recorded by name.

        The declared `sha256` is signed into the upload URL so the object store
        can verify the bytes on arrival — **where the store honours it.** Ceph
        RGW signs the header and ignores the content, so send `content_md5`
        too: it is enforced there, and on the stores that check both.
      operationId: registerFile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileRegistration"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadTarget"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            This tier may not upload, or a possession proof was wrong.
        "409":
          description: |
            A raw file with this name is already registered against different
            content. One raw name means one file, because analysis files
            inherit their raw's visibility by name, and the first registration
            of a name keeps it.

            Several Spyglass instances may share one broker, and a file name is
            unique only within an instance — so this can mean two genuinely
            different sessions named the same. Settle that upstream by renaming
            and registering again; the broker will not let one name mean two
            files.
        "428":
          description: |
            The content is already stored and this identity cannot read it, so
            possession must be proved before claiming it. The body carries the
            byte range to digest; retry with `possession_proof` set to
            `sha256(f"{offset}:".encode() + data)`.

            Registration deduplicates, so without this a caller who merely
            knew a digest could claim the content behind it and share it
            onward — and revoking the original visibility would not take it
            back.

            The challenge is nested under `detail`, which is how this service
            reports every error.
          content:
            application/json:
              schema:
                type: object
                required: [detail]
                properties:
                  detail:
                    $ref: "#/components/schemas/PossessionChallenge"
        "429":
          $ref: "#/components/responses/Throttled"

  /file/{file_id}/content:
    get:
      summary: Stable content URL
      description: |
        Redirects to a freshly signed URL. The client holds this stable URL, so
        an expiring signature never leaks into a long-running analysis: each
        range request re-follows the redirect and gets a fresh signature.
      operationId: getFileContent
      parameters:
        - name: file_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the object store
          headers:
            Location:
              schema:
                type: string
                format: uri
            Cache-Control:
              schema:
                type: string
              description: |
                Always no-store. The stable URL works because every request
                re-signs; a cached redirect would replay a signature past its
                expiry and fail mid-session.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not readable by this identity
        "404":
          description: |
            No such file, or none this identity may read. The two are one
            answer on purpose: distinguishing them would confirm a file exists
            to a caller with no right to know, and would stop a client falling
            through to another source that can serve it.
        "409":
          description: |
            Registered, but the bytes have not arrived yet. A normal transient
            state — uploads are expected to be slow — not an error to clean up.
        "429":
          $ref: "#/components/responses/Throttled"

  /file/{file_id}/visibility:
    patch:
      summary: Change who may read a file
      description: Owner only. Takes effect immediately, with no re-upload.
      operationId: setVisibility
      parameters:
        - name: file_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Visibility"
      responses:
        "200":
          description: The visibility now in force
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisibilityResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            Not the owner. Readability is not enough — a team member may read
            a file without being able to widen who else can.
        "404":
          description: No such file
        "422":
          description: Scope is group but no teams were named

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  responses:
    Unauthorized:
      description: |
        Missing, malformed, or unrecognized bearer token.

        Distinct from 403: this means the caller was never identified, so
        retrying with a valid token may succeed. A 403 means the identity is
        known and refused, and retrying will not help.
      headers:
        WWW-Authenticate:
          schema:
            type: string

    Throttled:
      description: Quota or rate limit reached
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait. Clients back off with jitter.

  schemas:
    Sha256:
      type: string
      pattern: "^[0-9a-f]{64}$"

    ServerInfo:
      type: object
      required: [api_version, upload_digests]
      properties:
        api_version:
          type: string
          example: v1
        upload_digests:
          type: array
          description: |
            Digests to compute and send on registration. Always contains
            `sha256`, which is the object's address whatever the store does
            with it. Contains `md5` as well when the store will not verify the
            sha256 checksum — send it as `content_md5`.
          items:
            type: string
            enum: [sha256, md5]
          example: [sha256, md5]

    DeviceCode:
      type: object
      required: [device_code, user_code, verification_uri, interval, expires_in]
      properties:
        device_code:
          type: string
        user_code:
          type: string
          description: Shown to the user to type at GitHub.
        verification_uri:
          type: string
          format: uri
        interval:
          type: integer
          description: Minimum seconds between polls.
        expires_in:
          type: integer

    Token:
      type: object
      required: [access_token, tier]
      properties:
        access_token:
          type: string
        tier:
          type: string
          enum: [unverified, verified, trusted, admin]
        github_login:
          type: string

    File:
      type: object
      required:
        [file_id, sha256, size_bytes, spyglass_name, file_class, uploaded]
      properties:
        file_id:
          type: string
        sha256:
          $ref: "#/components/schemas/Sha256"
        size_bytes:
          type: integer
          format: int64
        spyglass_name:
          type: string
        file_class:
          type: string
          enum: [raw, analysis]
        uploaded:
          type: boolean
          description: |
            False while a registration exists but its bytes have not arrived.
            Lets a client see that someone else's upload is still in progress
            rather than treating the file as broken.

    FileRegistration:
      type: object
      required: [sha256, size_bytes, spyglass_name, file_class]
      properties:
        sha256:
          $ref: "#/components/schemas/Sha256"
        size_bytes:
          type: integer
          format: int64
        spyglass_name:
          type: string
        file_class:
          type: string
          enum: [raw, analysis]
        visibility:
          allOf:
            - $ref: "#/components/schemas/Visibility"
          description: |
            Omit it and the broker decides:

            - a **raw** file becomes public — shared storage exists to be
              shared, and a file nobody can read is a share that did nothing;
            - an **analysis** file takes the visibility of the raw it was
              derived from, and *follows* it, so re-scoping a session
              re-scopes its results. With no raw on record, public.

            Send a scope and it is honoured exactly, including one **wider**
            than the raw's — that is a choice the owner is allowed to make,
            and it stops following the raw from then on. `PATCH
            /file/{file_id}/visibility` does the same.

            This is the rule for an omitted field, not a fallback applied on
            error. A file whose grants were never recorded is readable by its
            owner alone.
        content_md5:
          type: string
          pattern: "^[0-9a-f]{32}$"
          description: |
            Hex MD5 of the same bytes. Optional, and worth sending.

            The broker signs it into the upload URL as `Content-MD5`, which
            some stores enforce even where they ignore
            `x-amz-checksum-sha256` — Ceph RGW signs the SHA-256 checksum and
            then does not check the bytes against it. Send both and each store
            enforces the strongest check it supports.

            MD5 is a corruption check, not a security control: collisions are
            constructible. Where the store honours the SHA-256 checksum, that
            stronger check still applies.
        possession_proof:
          type: string
          description: |
            Answer to a prior 428 challenge. Needed only when claiming content
            already stored that this identity cannot read.

    PossessionChallenge:
      type: object
      required: [detail, sha256, offset, length]
      properties:
        detail:
          type: string
        sha256:
          $ref: "#/components/schemas/Sha256"
        offset:
          type: integer
          description: First byte of the range to digest.
        length:
          type: integer
          description: How many bytes.

    UploadTarget:
      type: object
      required: [file_id, deduplicated]
      properties:
        file_id:
          type: string
        deduplicated:
          type: boolean
          description: True when the object already existed; no upload needed.
        upload_url:
          type: string
          format: uri
          description: Absent when deduplicated.
        upload_headers:
          type: object
          additionalProperties:
            type: string
          description: |
            Headers to send verbatim with the PUT. They carry the checksum the
            store verifies the uploaded bytes against, and they are covered by
            the URL signature — omitting them fails the upload rather than
            skipping verification. Empty when deduplicated.

    VisibilityResult:
      type: object
      required: [file_id, scope, teams]
      properties:
        file_id:
          type: string
        scope:
          type: string
          enum: [private, group, public]
        teams:
          type: array
          items:
            type: string

    Visibility:
      type: object
      required: [scope]
      properties:
        scope:
          type: string
          enum: [private, group, public]
          description: |
            `group` requires at least one team, and is refused without one —
            a group naming nobody would silently be a private file.
        teams:
          type: array
          description: LabTeam names. Used when scope is group.
          items:
            type: string
